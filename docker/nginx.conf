server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Astro emits one folder per route (/about -> /about/index.html),
    # so let the index directive resolve directories.
    location / {
        try_files $uri $uri/ =404;
    }

    # Fingerprinted build output can be cached hard.
    # NOTE: no add_header here on purpose, it would drop the server-level
    # security headers below.
    location /_astro/ {
        expires 1y;
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
